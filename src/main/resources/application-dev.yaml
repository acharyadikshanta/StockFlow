spring:
  security:
    user:
      name: root
      password: root

  datasource:
    driver-class-name: ${DRIVER_CLASS_NAME}
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stockflow_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    com.acharya.dikshanta.StockFlow: DEBUG
